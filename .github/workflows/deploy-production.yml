name: Deploy production

on:
  push:
    branches:
      - main

concurrency:
  group: dateplanner-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/rodrigobojorquez/dateplanner-api
  APP_IMAGE: ghcr.io/rodrigobojorquez/dateplanner-app

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore DatePlanner.slnx

      - name: Run .NET tests
        run: dotnet test DatePlanner.slnx --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/app
        run: npm ci

      - name: Lint frontend
        working-directory: src/app
        run: npm run lint

      - name: Build frontend
        working-directory: src/app
        run: npm run build

  publish:
    name: Publish production images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/API/DatePlanner.Api/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dateplanner-api
          cache-to: type=gha,mode=max,scope=dateplanner-api

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/app
          file: src/app/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dateplanner-app
          cache-to: type=gha,mode=max,scope=dateplanner-app

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.ssh/dateplanner_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/dateplanner_deploy" "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/dateplanner_deploy"
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/dateplanner_deploy" > /dev/null

      - name: Upload Compose definition
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          SSH_OPTIONS=(-i "$HOME/.ssh/dateplanner_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          printf -v quoted_deploy_path '%q' "$VPS_DEPLOY_PATH"
          ssh "${SSH_OPTIONS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $quoted_deploy_path"
          scp "${SSH_OPTIONS[@]}" -P "$VPS_PORT" compose.production.yaml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/compose.production.yaml.next"

      - name: Pull and start release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          SSH_OPTIONS=(-i "$HOME/.ssh/dateplanner_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTIONS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s -- \
            "$VPS_DEPLOY_PATH" \
            "${API_IMAGE}:${GITHUB_SHA}" \
            "${APP_IMAGE}:${GITHUB_SHA}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_path=$1
          api_image=$2
          app_image=$3

          cd "$deploy_path"
          test -f .env.production || {
            echo "Missing $deploy_path/.env.production" >&2
            exit 1
          }

          mv compose.production.yaml.next compose.production.yaml

          had_previous_release=false
          if test -f .env.release; then
            cp .env.release .env.release.previous
            had_previous_release=true
          fi

          printf 'DATEPLANNER_API_IMAGE=%s\nDATEPLANNER_APP_IMAGE=%s\n' \
            "$api_image" "$app_image" > .env.release
          chmod 600 .env.release

          compose=(docker compose --env-file .env.production --env-file .env.release -f compose.production.yaml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull database api app

          if ! "${compose[@]}" up -d --no-build --remove-orphans --wait --wait-timeout 180; then
            echo "Deployment diagnostics:" >&2
            "${compose[@]}" ps --all >&2 || true
            "${compose[@]}" logs --no-color --tail 200 database api app >&2 || true

            for service in database api app; do
              container_id=$("${compose[@]}" ps --quiet "$service" 2>/dev/null || true)
              if test -n "$container_id"; then
                echo "Health state for $service:" >&2
                docker inspect --format '{{json .State.Health}}' "$container_id" >&2 || true
              fi
            done

            if test "$had_previous_release" = true; then
              echo "Deployment failed; restoring the previous image release." >&2
              mv .env.release.previous .env.release
              "${compose[@]}" pull api app
              "${compose[@]}" up -d --no-build --remove-orphans --wait --wait-timeout 180
            fi
            exit 1
          fi

          rm -f .env.release.previous
          "${compose[@]}" ps
          REMOTE_SCRIPT

      - name: Verify public endpoints
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          base_url=${PUBLIC_URL%/}
          health_response=$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base_url/health")
          test "$health_response" = "healthy"
          swagger_response=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "$base_url/swagger/v1/swagger.json")
          grep -q '"openapi"' <<< "$swagger_response"
