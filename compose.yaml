services:
  dateplanner.api:
    image: dateplanner.api
    container_name: DatePlanner.Api
    build:
      context: .
      dockerfile: src/API/DatePlanner.Api/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      dateplanner.database:
        condition: service_healthy

  dateplanner.database:
    image: postgres:18
    container_name: DatePlanner.Database
    environment:
      POSTGRES_DB: dateplanner_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dateplanner-postgres-data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  dateplanner.app:
    image: dateplanner.app
    container_name: DatePlanner.App
    build:
      context: ./src/app
      dockerfile: Dockerfile

    command:
      - /bin/sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

    volumes:
      - ./src/app:/app
      - dateplanner-node-modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: "http://dateplanner.api:8080"

    ports:
      - "5173:5173"

    depends_on:
      dateplanner.api:
        condition: service_healthy

volumes:
  dateplanner-postgres-data:
  dateplanner-node-modules:
